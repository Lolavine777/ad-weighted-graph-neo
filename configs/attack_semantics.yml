    source_kinds: ["User", "Group", "Computer"]
    target_kinds: ["Group"]
    action_required: false
    prerequisites: ["actor_controlled", "source_authorized", "actor_enabled", "security_group", "membership_usable"]
    effects: ["effective_member"]
    failure_conditions: ["group_not_security_enabled", "token_or_scope_incompatible"]
    expected_telemetry: []
    attack_refs: []
    confidence: "medium"
    cost_factors: ["authorization_context"]
    remediation: ["Review security group membership"]
  - id: obtain_admin_execution_on_host
