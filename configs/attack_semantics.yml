# Normative semantic catalog. Expected telemetry is a prediction, not corpus evidence.
# Version 0.3 adds scoped Week 3 capability transitions without canonical edge kinds.
version: "0.6"
evidence_registry:
  ms-security-4724:
    type: authoritative_reference
    source: Microsoft Learn
    locator: https://learn.microsoft.com/en-us/windows/security/threat-protection/auditing/event-4724
    claim: Security Event 4724 is emitted for a password reset attempt against another account.
    rationale: >-
      This supports the reset_target_password and genericall_reset_password
      expectations; it does not prove reset success or a static directory right.
    confidence: high
  ms-security-group-membership:
    type: authoritative_reference
    source: Microsoft Learn
    locator: https://learn.microsoft.com/en-us/windows/security/threat-protection/auditing/event-4732
    claim: Group-membership modification events are action telemetry for adding a member to a security-enabled group.
    rationale: The event family supports the active genericall_add_member transition, not passive MemberOf traversal.
    confidence: high
  ms-security-4728:
    type: authoritative_reference
    source: Microsoft Learn
    locator: >-
      https://learn.microsoft.com/en-us/windows-server/identity/ad-ds/plan/security-best-practices/advanced-audit-policy-configuration
    claim: Security Event 4728 records a member added to a security-enabled global group.
    rationale: This covers the global-group branch of genericall_add_member.
    confidence: high
  ms-security-4756:
    type: authoritative_reference
    source: Microsoft Learn
    locator: >-
      https://learn.microsoft.com/en-us/windows-server/identity/ad-ds/plan/security-best-practices/advanced-audit-policy-configuration
    claim: Security Event 4756 records a member added to a security-enabled universal group.
    rationale: This covers the universal-group branch of genericall_add_member.
    confidence: high
  ms-security-5136:
    type: authoritative_reference
    source: Microsoft Learn
    locator: https://learn.microsoft.com/en-us/windows/security/threat-protection/auditing/event-5136
    claim: >-
      Security Event 5136 can record a directory-object attribute modification
      when Directory Service Changes auditing and a matching SACL apply.
    rationale: >-
      This supports ACL-change-shaped telemetry for DACL mutation while
      preserving the distinction from static WriteDacl or GenericAll evidence.
    confidence: high
  ms-security-4624-logontype10:
    type: authoritative_reference
    source: Microsoft Learn
    locator: https://learn.microsoft.com/en-us/windows/security/threat-protection/auditing/event-4624
    claim: Security Event 4624 with Logon Type 10 represents a RemoteInteractive logon signal.
    rationale: The qualifier is required; Event 4624 without LogonType 10 is not an RDP-specific mapping.
    confidence: high
  mitre-t1021-001:
    type: attack_framework_reference
    source: MITRE ATT&CK
    locator: https://attack.mitre.org/techniques/T1021/001/
    claim: Remote Desktop Protocol is a distinct remote-services technique.
    rationale: >-
      This supports the semantic interpretation of
      open_remote_interactive_session without making a structural CanRDP edge
      or logon row a confirmed attack.
    confidence: high
  ms-winrm-powershell-audit:
    type: authoritative_reference
    source: Microsoft Learn
    locator: https://learn.microsoft.com/en-us/powershell/module/microsoft.powershell.core/about/about_logging_windows
    claim: WinRM and PowerShell operational/script logging are configuration-dependent activity signals.
    rationale: CanPSRemote has no single mandatory event ID; provider-specific fields and audit configuration are required.
    confidence: medium
  mitre-t1021-006:
    type: attack_framework_reference
    source: MITRE ATT&CK
    locator: https://attack.mitre.org/techniques/T1021/006/
    claim: Windows Remote Management is a distinct remote-services technique.
    rationale: This supports the remote-command transition while keeping WinRM execution separate from host-bound structural authorization.
    confidence: high
  mitre-t1003-001:
    type: attack_framework_reference
    source: MITRE ATT&CK
    locator: https://attack.mitre.org/techniques/T1003/001/
    claim: LSASS Memory is a credential-access technique requiring process/target qualification.
    rationale: >-
      This supports credential-access monitoring for recover_session_credential_material; Sysmon Event 10 alone is not sufficient proof.
    confidence: high
  ms-sysmon-event10:
    type: authoritative_reference
    source: Microsoft Sysinternals
    locator: https://learn.microsoft.com/en-us/sysinternals/downloads/sysmon
    claim: Sysmon Event 10 records process-access activity.
    rationale: It is an optional descriptive signal for credential access and must be qualified by TargetImage and related fields.
    confidence: high
  ms-security-session-boundary:
    type: authoritative_reference
    source: Microsoft Learn
    locator: https://learn.microsoft.com/en-us/windows/security/threat-protection/auditing/event-4624
    claim: Security logon/session events can provide session-boundary context when correlated with identity, host and time.
    rationale: >-
      A HasSession relationship is an opportunity; session telemetry does not itself establish credential material or credential theft.
    confidence: medium
  ms-kerberos-authentication:
    type: authoritative_reference
    source: Microsoft Learn
    locator: https://learn.microsoft.com/en-us/windows-server/security/kerberos/kerberos-authentication-overview
    claim: Kerberos authenticates an identity before service authorization.
    rationale: Supports a separate acquire-ticket gate; reset alone does not establish usable identity.
    confidence: high
  ms-access-token-groups:
    type: authoritative_reference
    source: Microsoft Learn
    locator: https://learn.microsoft.com/en-us/windows/win32/secauthz/access-tokens
    claim: Access tokens include user identity and group SIDs used for authorization.
    rationale: Supports branch actor and membership context; snapshot membership alone is not an observed
      token.
    confidence: high
  ms-winrm-security:
    type: authoritative_reference
    source: Microsoft Learn
    locator: https://learn.microsoft.com/en-us/powershell/scripting/security/remoting/winrm-security
    claim: PowerShell remoting authenticates users and runs sessions under their security context.
    rationale: Listener, endpoint access and administrative execution context remain explicit scenario
      gates.
    confidence: high
  ms-da-default-administrators:
    type: authoritative_reference
    source: Microsoft Learn
    locator: >-
      https://learn.microsoft.com/en-us/windows-server/identity/ad-ds/plan/security-best-practices/appendix-b--privileged-accounts-and-groups-in-active-directory
    claim: Domain Admins has default Administrators membership on domain computers.
    rationale: Default behavior supports a declared host mapping, not an inferred canonical AdminTo
      edge.
    confidence: high
