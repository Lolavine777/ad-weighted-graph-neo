name: Viewer
'on':
  push:
    paths:
      - web/neo-viewer/**
      - reports/neo/ranking-C-example.md
      - reports/neo/remediation-rediscovery-results.json
      - reports/neo/decision-sample.json
      - .github/workflows/viewer.yml
  pull_request:
    paths:
      - web/neo-viewer/**
      - reports/neo/ranking-C-example.md
      - reports/neo/remediation-rediscovery-results.json
      - reports/neo/decision-sample.json
      - .github/workflows/viewer.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  adapters:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/neo-viewer/package-lock.json
      - name: Install test dependencies only
        run: npm ci --prefix web/neo-viewer --ignore-scripts --no-audit --no-fund
      - name: Check adapters, UI interactions and published playback pins
        run: npm test --prefix web/neo-viewer
      - name: Check JavaScript syntax
        run: |
          node --check web/neo-viewer/model.js
          node --check web/neo-viewer/app.js
          node --check web/neo-viewer/demo.js
      - name: Build standalone offline demo
        run: python web/neo-viewer/build.py --output "$RUNNER_TEMP/neo-viewer.html"
