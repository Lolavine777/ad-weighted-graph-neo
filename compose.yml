name: ad-weighted-graph
services:
  neo4j:
    image: neo4j:2026.08.1
    profiles: [graph]
    environment:
      NEO4J_AUTH: "neo4j/${NEO4J_PASSWORD:?Set NEO4J_PASSWORD in your local .env}"
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 1G
      NEO4J_server_memory_pagecache_size: 512m
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    volumes:
      - neo4j_data:/data
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          cypher-shell -u neo4j -p "$${NEO4J_AUTH#neo4j/}" 'RETURN 1;' > /dev/null 2>&1
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 40s
volumes:
  neo4j_data:
